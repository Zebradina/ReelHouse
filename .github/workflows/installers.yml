name: Installers

# Builds every installer on a native runner and attaches it to the release.
#
# macOS is built once per architecture on purpose: ffmpeg-static and
# @ffprobe-installer install the binary for the *host*, so an Intel DMG made on
# Apple silicon would carry an arm64 FFmpeg (and vice versa). macOS 15 is the
# arm64 image; macos-15-intel is the x86_64 one (the last Intel image Actions
# offers, through August 2027).
#
# Tag push -> release for that tag. workflow_dispatch -> rebuild the assets of an
# existing release, e.g. `gh workflow run installers.yml -f tag=v1.6.0`.
#
# Signing is driven by repository secrets and degrades in steps: no secrets ->
# unsigned installers with a warning annotation; a certificate -> signed; a
# certificate plus Apple credentials -> signed, notarised and stapled. The
# secrets themselves are documented in README.md under "Code signing".

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the installers to (e.g. v1.6.0)
        required: true
      ref:
        description: Source ref to build (defaults to the tag decided above)
        required: false

permissions:
  contents: write

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A secret that does not exist resolves to an empty string, and
      # electron-builder only checks CSC_LINK for null — an empty value makes it
      # try to import "" as a certificate and fail the build. So export the
      # variables only when they are actually set.
      - name: Configure signing
        env:
          CERT: ${{ secrets.MAC_CSC_LINK }}
          CERT_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERT" ]; then
            echo "::warning title=Unsigned macOS build::MAC_CSC_LINK is not set, so this DMG ships unsigned and Gatekeeper will block it until the quarantine flag is cleared."
          else
            echo "CSC_LINK=$CERT" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CERT_PASSWORD" >> "$GITHUB_ENV"
            echo "Certificate found: signing with a Developer ID."
          fi

          if [ -n "$APPLE_ID_SECRET" ]; then
            echo "APPLE_ID=$APPLE_ID_SECRET" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_SECRET" >> "$GITHUB_ENV"
          fi

          if [ -z "$CERT" ] && [ -n "$APPLE_ID_SECRET" ]; then
            echo "::warning title=Notarisation skipped::Apple credentials are set but MAC_CSC_LINK is not, and only a Developer ID signature can be notarised."
          elif [ -n "$CERT" ] && [ -z "$APPLE_ID_SECRET" ]; then
            echo "::warning title=Not notarised::The app will be signed but not notarised, because APPLE_ID is not set."
          fi

      - name: Build DMG
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never

      # package.json lists both architectures for each macOS target, so a single
      # build produces two DMGs: this runner's own (correct) one and the other
      # architecture packed with the host's FFmpeg (wrong). Mount the DMG we are
      # about to publish and prove the player, FFmpeg and ffprobe inside it match.
      - name: Verify the DMG and pick the matching one
        id: dmg
        run: |
          # `file` spells the Intel architecture x86_64, not x64.
          case "${{ matrix.arch }}" in
            x64) EXPECT=x86_64 ;;
            *) EXPECT=arm64 ;;
          esac

          if [ "${{ matrix.arch }}" = 'arm64' ]; then
            DMG=$(ls dist/*-arm64.dmg | head -1)
          else
            DMG=$(ls dist/*.dmg | grep -v -- '-arm64\.dmg$' | head -1)
          fi
          echo "dmg: $DMG"

          MOUNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" "$DMG" >/dev/null
          trap 'hdiutil detach "$MOUNT" >/dev/null 2>&1 || true' EXIT

          APP="$MOUNT/ReelHouse.app"
          FFMPEG=$(find "$APP" -type f -name ffmpeg | head -1)
          FFPROBE=$(find "$APP" -type f -name ffprobe | head -1)
          file "$APP/Contents/MacOS/ReelHouse" "$FFMPEG" "$FFPROBE"
          file "$FFMPEG" "$FFPROBE" | grep -q "$EXPECT"

          # Signing checks only make sense when a certificate was imported;
          # without one the app is ad-hoc signed and Gatekeeper will reject it.
          if [ -n "$CSC_LINK" ]; then
            echo "== signature =="
            codesign --verify --deep --strict --verbose=2 "$APP"
            # ffmpeg/ffprobe are exec'd as child processes, so a broken seal on
            # them breaks transcoding rather than playback.
            codesign --verify --strict --verbose=2 "$FFMPEG"

            SIGNATURE=$(codesign -dv --verbose=4 "$APP" 2>&1)
            echo "$SIGNATURE" | grep -E '^(Identifier|Authority|TeamIdentifier)='
            # --verify also passes for an ad-hoc signature, which Gatekeeper
            # rejects, so require the certificate type we asked for.
            echo "$SIGNATURE" | grep -q '^Authority=Developer ID Application'

            if [ -n "$APPLE_ID" ]; then
              echo "== notarisation =="
              xcrun stapler validate "$APP"
              spctl --assess --type execute --verbose=4 "$APP"
            else
              echo "not notarised: no Apple credentials"
            fi
          else
            echo "unsigned build: no certificate to verify"
          fi

          echo "path=$DMG" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same reason as the macOS job: an unset secret is an empty string, and
      # electron-builder would try to import "" as a certificate.
      - name: Configure signing
        shell: pwsh
        env:
          CERT: ${{ secrets.WIN_CSC_LINK }}
          CERT_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT)) {
            Write-Host "::warning title=Unsigned Windows build::WIN_CSC_LINK is not set, so the installers ship unsigned and SmartScreen will warn about an unknown publisher."
            exit 0
          }
          "WIN_CSC_LINK=$($env:CERT)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WIN_CSC_KEY_PASSWORD=$($env:CERT_PASSWORD)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Certificate found: signing the installers."

      - name: Build installer and portable exe
        run: npx electron-builder --win --publish never

      # electron-builder reports a failed signature as a warning, so check the
      # Authenticode signature on what is about to be published.
      - name: Verify the installers are signed
        if: env.WIN_CSC_LINK != ''
        shell: pwsh
        run: |
          $unsigned = @()
          Get-ChildItem dist/*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature -FilePath $_.FullName
            Write-Host ("{0}: {1}" -f $_.Name, $sig.Status)
            Write-Host ("  signer: {0}" -f $sig.SignerCertificate.Subject)
            if ($sig.Status -ne 'Valid') { $unsigned += $_.Name }
          }
          if ($unsigned.Count -gt 0) { throw "Not validly signed: $($unsigned -join ', ')" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  android:
    name: Android TV APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          # No `cache: gradle`: it hashes the Gradle files in the checkout, and
          # a tag that predates android/ would fail the whole job over a cache
          # lookup. The wrapper download is a minute; a red build is worse.

      - uses: android-actions/setup-android@v3

      - name: Build the TV app
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain

      # The APK is the only artifact nobody can inspect by eye, so check that it
      # is a real TV app: package id, a Leanback launcher entry, and a signature
      # that a device will accept.
      - name: Verify the APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          BADGING=$("$ANDROID_HOME"/build-tools/*/aapt2 dump badging "$APK")
          echo "$BADGING" | head -6
          echo "$BADGING" | grep -q "package: name='com.reelhouse.tv'"
          echo "$BADGING" | grep -q "leanback-launchable-activity"
          "$ANDROID_HOME"/build-tools/*/apksigner verify "$APK"

      - name: Rename for the release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/release/app-release.apk "ReelHouse-$VERSION-tv.apk"
          ls -l "ReelHouse-$VERSION-tv.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ReelHouse-*-tv.apk
          if-no-files-found: error

  release:
    name: Attach to release
    needs: [macos, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers

      - name: List installers
        run: find installers -type f -printf '%p %s bytes\n' | sort

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            installers/macos-arm64/*.dmg
            installers/macos-x64/*.dmg
            installers/windows/*.exe
            installers/android/*.apk
          overwrite_files: true
          fail_on_unmatched_files: true

      # Checksums are computed from the exact bytes being published and replace
      # any earlier block, so re-running a release never stacks duplicates.
      - name: Publish SHA-256 checksums
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout, so tell gh which repository to talk to.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          : > SHA256SUMS.txt
          for file in installers/*/*; do
            [ -f "$file" ] || continue
            printf '%s  %s\n' "$(sha256sum "$file" | cut -d' ' -f1)" "$(basename "$file")"
          done | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

          {
            printf '\n## SHA-256 checksums\n\n```\n'
            cat SHA256SUMS.txt
            printf '```\n\nVerify before installing: `shasum -a 256 <file>` on macOS, `certutil -hashfile <file> SHA256` on Windows.\n'
          } > CHECKSUMS.md

          gh release view "$TAG" --json body -q .body \
            | awk '/^## SHA-256 checksums$/{exit} {print}' > BODY.md
          cat CHECKSUMS.md >> BODY.md
          gh release edit "$TAG" --notes-file BODY.md
          gh release upload "$TAG" SHA256SUMS.txt --clobber
