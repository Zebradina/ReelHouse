<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08090c" />
    <title>ReelHouse</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0c10'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%23f0b64b' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%23f0b64b'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/css/app.css?v=5" />
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to content</a>

    <header class="topbar" id="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#/" aria-label="ReelHouse home">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="12.5" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".55" />
            <circle cx="16" cy="16" r="7" fill="none" stroke="currentColor" stroke-width="2" />
            <circle cx="16" cy="16" r="2.2" fill="currentColor" />
            <circle cx="16" cy="4.6" r="1.7" fill="currentColor" opacity=".8" />
            <circle cx="16" cy="27.4" r="1.7" fill="currentColor" opacity=".8" />
            <circle cx="4.6" cy="16" r="1.7" fill="currentColor" opacity=".8" />
            <circle cx="27.4" cy="16" r="1.7" fill="currentColor" opacity=".8" />
          </svg>
          <span>Reel<em>House</em></span>
        </a>

        <nav class="nav" id="nav" aria-label="Primary">
          <a href="#/" data-nav="home">Home</a>
          <a href="#/movies" data-nav="movies">Movies</a>
          <a href="#/shows" data-nav="shows">TV Shows</a>
          <a href="#/discover" data-nav="discover">Discover</a>
          <a href="#/guide" data-nav="guide">TV Guide</a>
        </nav>

        <div class="topbar-tools">
          <div class="search" id="search-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <input id="search-input" type="search" placeholder="Search library" autocomplete="off" spellcheck="false" aria-label="Search library" />
            <kbd>/</kbd>
            <div class="search-results" id="search-results" hidden></div>
          </div>
          <button class="icon-btn" id="scan-btn" title="Rescan library" aria-label="Rescan library">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <a class="icon-btn" href="#/settings" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.2v2.2M12 18.6v2.2M3.2 12h2.2M18.6 12h2.2M5.8 5.8l1.6 1.6M16.6 16.6l1.6 1.6M18.2 5.8l-1.6 1.6M7.4 16.6l-1.6 1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </a>
        </div>
      </div>
      <div class="scan-strip" id="scan-strip" hidden>
        <div class="scan-strip-fill" id="scan-strip-fill"></div>
        <span class="scan-strip-text" id="scan-strip-text"></span>
      </div>
    </header>

    <main id="view" tabindex="-1"></main>

    <div class="toast-stack" id="toasts" aria-live="polite"></div>

    <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
    <aside class="sheet" id="sheet" hidden aria-modal="true" role="dialog" aria-labelledby="sheet-title"></aside>

    <!-- hls.js drives playback of anything the browser cannot decode itself. -->
    <script src="/vendor/hls.min.js"></script>
    <script type="module" src="/js/app.js?v=5"></script>
  </body>
</html>
